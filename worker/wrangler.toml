name = "foodlog-ai"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Routes are ordered fallback lists of `provider:model`. The models below are placeholders:
# pick your own. Providers: `anthropic`, `openai`, and `compat-<name>` (see README).
[vars]
# Gemini via Google's OpenAI-compatible endpoint (compared 2026-11-19 on real meals and labels):
# 4 Hydrogen gave the closest estimates but was often overloaded; 3.5 Flash-Lite was always up,
# fast and exact on labels, but estimates ran ~20% high. Each attempt times out after 30 s.
ESTIMATE_ROUTE = "compat-gemini:gemini-4-hydrogen,compat-gemini:gemini-3.5-flash-lite"
LABEL_ROUTE = "compat-gemini:gemini-3.5-flash-lite,compat-gemini:gemini-4-hydrogen"
COMPAT_GEMINI_BASE_URL = "https://generativelanguage.googleapis.com/v1beta/openai"
# COMPARE = "1"   # evaluation only: call every route entry and log a comparison line

# Secrets (never put these in this file). Set each with `npx wrangler@4.165.0 secret put <NAME>`:
#   APP_TOKEN            bearer token the iPhone app sends (rotate to revoke)
#   ANTHROPIC_API_KEY    for `anthropic:` routes
#   OPENAI_API_KEY       for `openai:` routes (optional OPENAI_BASE_URL overrides the endpoint)
#   COMPAT_<NAME>_API_KEY / COMPAT_<NAME>_BASE_URL   for each `compat-<name>:` route
# For local dev, put the same names in worker/.dev.vars (gitignored).
